[project]
name = "job-search-loop"
version = "0.1.0"
description = "A job search loop around any coding harness, driven through harness-interface."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests", "tools"]
addopts = "-m 'not docker and not live'"
markers = ["docker: needs Docker and the job-search-check image", "live: talks to a real job board"]
