[project]
name = "job-search-loop"
version = "0.1.0"
description = "A job search loop around any coding harness, driven through harness-interface."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-m 'not docker'"
markers = ["docker: needs a running Docker daemon and the job-search-check image"]
